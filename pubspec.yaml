name: photofy
description: A Pixso-based Flutter photo editor and AI toolbox prototype.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/photofy/
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/photofy/Urbanist.ttf

